function clampView(){const minSpan=Math.min(12,pts.length-1);let span=end-start;if(span<minSpan){const c=(start+end)/2;span=minSpan;start=c-span/2;end=c+span/2}if(start<0){end-=start;start=0}if(end>pts.length-1){start-=end-(pts.length-1);end=pts.length-1}start=Math.max(0,start);end=Math.min(pts.length-1,end);}
function setRange(kind){let target=pts.length-1;if(kind==="5Y"){const t=pts[pts.length-1].t-5*365.25*864e5;target=pts.findIndex(p=>p.t>=t);if(target<0)target=0}else if(kind==="10Y"){const t=pts[pts.length-1].t-10*365.25*864e5;target=pts.findIndex(p=>p.t>=t);if(target<0)target=0}start=target;end=pts.length-1;document.querySelectorAll('#ranges button').forEach(b=>b.classList.toggle('active',b.dataset.r===kind));draw();}
function zoom(f,center=(start+end)/2){const span=Math.max(12,(end-start)*f);start=center-span/2;end=center+span/2;clampView();draw();}
function xAt(i){return 10+(i-start)/(end-start)*Math.max(1,W-82);}
function logY(v,lo,hi){const a=Math.log10(lo),b=Math.log10(hi);return 8+(b-Math.log10(v))/(b-a)*(H-31);}
function fmt(v){return new Intl.NumberFormat('en-US',{maximumFractionDigits:0}).format(v);}
function dateFmt(t){return new Intl.DateTimeFormat('en-GB',{year:'numeric',month:'short',day:'2-digit'}).format(new Date(t));}

function draw(){
  ctx.clearRect(0,0,W,H); if(!pts.length)return;
  const a=Math.max(0,Math.floor(start)),b=Math.min(pts.length-1,Math.ceil(end));
  const vals=pts.slice(a,b+1).map(p=>p.v);
  let min=Math.min(...vals),max=Math.max(...vals);
  let lo=Math.pow(10,Math.floor(Math.log10(min))),hi=Math.pow(10,Math.ceil(Math.log10(max)));
  if(lo===hi){lo/=10;hi*=10}
  ctx.font='10px -apple-system';ctx.textBaseline='middle';

  // Horizontal logarithmic grid
  for(let k=Math.floor(Math.log10(lo));k<=Math.ceil(Math.log10(hi));k++){
    for(let n=1;n<10;n++){
      const v=n*Math.pow(10,k);if(v<lo||v>hi)continue;
      const y=logY(v,lo,hi);
      ctx.strokeStyle=n===1?'#303540':'#1d2129';ctx.lineWidth=n===1?1:.6;
      ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W-50,y);ctx.stroke();
      if(n===1){ctx.fillStyle='#858c9a';ctx.textAlign='right';ctx.fillText(fmt(v),W-54,y)}
    }
  }

  // Time grid
  const span=end-start;const step=Math.max(1,Math.floor(span/8));
  for(let i=a;i<=b;i+=step){
    const x=xAt(i);ctx.strokeStyle='#181c23';ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H-25);ctx.stroke();
    ctx.fillStyle='#737a89';ctx.textAlign='center';ctx.textBaseline='alphabetic';
    ctx.fillText(new Date(pts[i].t).getFullYear(),x,H-7);
  }

  // Price line
  ctx.beginPath();
  for(let i=a;i<=b;i++){const x=xAt(i),y=logY(pts[i].v,lo,hi);if(i===a)ctx.moveTo(x,y);else ctx.lineTo(x,y)}
  ctx.strokeStyle='#2962ff';ctx.lineWidth=2;ctx.stroke();

  // Last price line/tag
  const last=pts[b],ly=logY(last.v,lo,hi);
  ctx.setLineDash([5,4]);ctx.strokeStyle='#26a69a';ctx.beginPath();ctx.moveTo(0,ly);ctx.lineTo(W-50,ly);ctx.stroke();ctx.setLineDash([]);
  priceTag.style.top=(ly-9)+'px';priceTag.style.display='block';priceTag.textContent=fmt(last.v);

  document.getElementById('hint').textContent=`${dateFmt(pts[a].t)} — ${dateFmt(pts[b].t)} · ${b-a+1} points · LOG`;
}

function showCross(i,clientX,clientY){
  i=Math.max(0,Math.min(pts.length-1,i));const p=pts[i];
  const r=box.getBoundingClientRect(),x=clientX-r.left,y=clientY-r.top;
  cross.style.display='block';cross.innerHTML=`${dateFmt(p.t)} · <b>${fmt(p.v)} IRR</b> · ${p.src}`;
  cross.style.left=Math.min(W-245,Math.max(5,x+10))+'px';cross.style.top=Math.max(5,y-38)+'px';
}
function idxFromX(clientX){const r=box.getBoundingClientRect(),x=clientX-r.left;return Math.round(start+(x-10)/Math.max(1,W-82)*(end-start));}

cv.addEventListener('pointerdown',e=>{
  cv.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pointers.size===1){pan={x:e.clientX,s:start,e:end};showCross(idxFromX(e.clientX),e.clientX,e.clientY)}
  if(pointers.size===2){const q=[...pointers.values()];pinch={dist:Math.hypot(q[0].x-q[1].x,q[0].y-q[1].y),s:start,e:end,mid:(q[0].x+q[1].x)/2}}
});
cv.addEventListener('pointermove',e=>{
  if(!pointers.has(e.pointerId))return;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pointers.size===2&&pinch){
    const q=[...pointers.values()],dist=Math.max(1,Math.hypot(q[0].x-q[1].x,q[0].y-q[1].y));
    const f=pinch.dist/dist,span=Math.max(12,(pinch.e-pinch.s)*f);
    const r=box.getBoundingClientRect(),cx=(pinch.mid-r.left-10)/Math.max(1,W-82);
    const center=pinch.s+cx*(pinch.e-pinch.s);
    start=center-span*cx;end=start+span;clampView();draw();
  }else if(pointers.size===1&&pan){
    const dx=e.clientX-pan.x,span=pan.e-pan.s,shift=-dx/Math.max(1,W-82)*span;
    start=pan.s+shift;end=pan.e+shift;clampView();draw();showCross(idxFromX(e.clientX),e.clientX,e.clientY);
  }
});
function pointerUp(e){pointers.delete(e.pointerId);if(!pointers.size){pan=null;pinch=null;}}
cv.addEventListener('pointerup',pointerUp);cv.addEventListener('pointercancel',pointerUp);
cv.addEventListener('wheel',e=>{e.preventDefault();zoom(e.deltaY>0?1.18:.85,idxFromX(e.clientX));showCross(idxFromX(e.clientX),e.clientX,e.clientY)},{passive:false});


const nav=document.getElementById('nav'),nctx=nav.getContext('2d'),navL=document.getElementById('navLeft'),navR=document.getElementById('navRight');
function drawNav(){
 const w=nav.clientWidth,h=nav.clientHeight,d=devicePixelRatio||1;nav.width=w*d;nav.height=h*d;nctx.setTransform(d,0,0,d,0,0);nctx.clearRect(0,0,w,h);
 if(!pts.length)return;const vs=pts.map(p=>Math.log10(p.v)),mn=Math.min(...vs),mx=Math.max(...vs);
 nctx.beginPath();pts.forEach((p,i)=>{const x=i/(pts.length-1)*w,y=4+(mx-Math.log10(p.v))/(mx-mn)*(h-8);i?nctx.lineTo(x,y):nctx.moveTo(x,y)});nctx.strokeStyle='#4a5680';nctx.lineWidth=1;nctx.stroke();
 const l=start/(pts.length-1)*w,r=end/(pts.length-1)*w;nctx.fillStyle='rgba(70,75,70,.5)';nctx.fillRect(l,0,r-l,h);nctx.strokeStyle='#6475b8';nctx.strokeRect(l+.5,.5,Math.max(1,r-l-1),h-1);
 navL.style.left=Math.max(0,l-5)+'px';navR.style.left=Math.min(w-10,r-5)+'px';
}
function dragNav(which,e){
 e.preventDefault();
 const move=ev=>{const q=nav.getBoundingClientRect(),f=Math.max(0,Math.min(1,(ev.clientX-q.left)/q.width)),idx=f*(pts.length-1);
  if(which==='L')start=Math.min(idx,end-12);else end=Math.max(idx,start+12);clampView();draw();drawNav();};
 const up=()=>{window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',up)};
 window.addEventListener('pointermove',move);window.addEventListener('pointerup',up);
}
navL.addEventListener('pointerdown',e=>dragNav('L',e));navR.addEventListener('pointerdown',e=>dragNav('R',e));
function oldRange(){const a=pts.findIndex(p=>p.t>=new Date('1979-03-21T12:00:00').getTime()),b=pts.findIndex(p=>p.t>=new Date('2002-03-20T12:00:00').getTime());start=Math.max(0,a);end=b>0?b:Math.min(pts.length-1,start+12);document.querySelectorAll('#ranges button').forEach(x=>x.classList.toggle('active',x.dataset.r==='OLD'));clampView();draw();drawNav();}
document.querySelector('#ranges [data-r="OLD"]').onclick=oldRange;

document.getElementById('plus').onclick=()=>zoom(.65);
document.getElementById('minus').onclick=()=>zoom(1.5);
document.getElementById('reset').onclick=()=>setRange('ALL');
document.querySelectorAll('#ranges button').forEach(b=>{if(b.dataset.r!=='OLD')b.onclick=()=>{setRange(b.dataset.r);drawNav()}});
window.addEventListener('resize',resize);
resize();
</script>
</body>
